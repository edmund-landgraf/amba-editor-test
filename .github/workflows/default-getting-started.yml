name: Default Getting Started
on:
  push:
    paths:
      - '.github/workflows/default-getting-started.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Getting Started default
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "e.on('init',sync);"
          new = "e.on('init',async()=>{e.setContent(gettingStarted());await sync()});"
          if old not in s:
              raise SystemExit('target init handler not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Open Getting Started by default"
          git rm .github/workflows/default-getting-started.yml
          git commit --amend --no-edit
          git push
